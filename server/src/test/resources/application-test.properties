# Test configuration for kkFileView
# This file provides test-specific configuration to prevent beans from failing during test initialization

# Mock office home to prevent OfficePluginManager initialization failures
# The actual office component is not needed for most unit tests
office.home=/tmp/mock-office-home

# Office plugin settings with minimal configuration
office.plugin.server.ports=2001,2002
office.plugin.task.timeout=5m
office.plugin.task.maxtasksperprocess=5
office.plugin.task.taskexecutiontimeout=5m

# File directory for tests
file.dir=/tmp/test-file-dir

# Disable cache for tests
cache.enabled=false
cache.type=jdk

# Other minimal configurations
simText=txt,html,htm,xml,json,properties,md,log,java
media=mp3,wav,mp4,flv
